name: Release OPH Control Studio

on:
  push:
    tags:
      - "0.3.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: v0.3/tauri

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: v0.3/tauri/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: v0.3/tauri/src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Windows executable and NSIS installer
        run: npm run tauri build -- --bundles nsis

      - name: Prepare release assets
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Copy-Item src-tauri/target/release/oph-control-studio.exe "release-assets/OPH-Control-Studio_${version}_windows-x64-portable.exe"
          Copy-Item src-tauri/target/release/bundle/nsis/*-setup.exe "release-assets/OPH-Control-Studio_${version}_windows-x64-setup.exe"

      - name: Create or update pre-release and upload assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create "${{ github.ref_name }}" `
              --repo "${{ github.repository }}" `
              --title "OPH Control Studio ${{ github.ref_name }}" `
              --generate-notes `
              --prerelease
          }
          gh release upload "${{ github.ref_name }}" `
            --repo "${{ github.repository }}" `
            --clobber `
            release-assets/*

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OPH-Control-Studio-Windows-x64
          path: v0.3/tauri/release-assets/*

  macos-release:
    needs: windows-release
    runs-on: macos-13
    defaults:
      run:
        working-directory: v0.3/tauri

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: v0.3/tauri/package-lock.json

      - name: Set up Rust for universal macOS
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: v0.3/tauri/src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build universal macOS application and disk image
        run: npm run tauri build -- --target universal-apple-darwin --bundles app,dmg

      - name: Prepare release assets
        run: |
          version="${{ github.ref_name }}"
          mkdir -p release-assets
          ditto -c -k --sequesterRsrc --keepParent \
            "src-tauri/target/universal-apple-darwin/release/bundle/macos/OPH Control Studio.app" \
            "release-assets/OPH-Control-Studio_${version}_macos-universal.app.zip"
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg \
            "release-assets/OPH-Control-Studio_${version}_macos-universal.dmg"

      - name: Upload assets to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" --repo "${{ github.repository }}" --clobber release-assets/*

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OPH-Control-Studio-macOS-universal
          path: v0.3/tauri/release-assets/*

  linux-release:
    needs: windows-release
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: v0.3/tauri

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: v0.3/tauri/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: v0.3/tauri/src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Linux packages
        run: npm run tauri build -- --bundles appimage,deb

      - name: Prepare release assets
        run: |
          version="${{ github.ref_name }}"
          mkdir -p release-assets
          cp src-tauri/target/release/oph-control-studio "release-assets/OPH-Control-Studio_${version}_linux-x64-portable"
          cp src-tauri/target/release/bundle/appimage/*.AppImage "release-assets/OPH-Control-Studio_${version}_linux-x64.AppImage"
          cp src-tauri/target/release/bundle/deb/*.deb "release-assets/OPH-Control-Studio_${version}_linux-x64.deb"
          chmod +x "release-assets/OPH-Control-Studio_${version}_linux-x64-portable" "release-assets/OPH-Control-Studio_${version}_linux-x64.AppImage"

      - name: Upload assets to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" --repo "${{ github.repository }}" --clobber release-assets/*

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OPH-Control-Studio-Linux-x64
          path: v0.3/tauri/release-assets/*
