name: Release OPH Control Studio for macOS

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing release tag to build and upload
        required: true
        type: string

permissions:
  contents: write

jobs:
  macos-release:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: v0.3/tauri

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: v0.3/tauri/package-lock.json

      - name: Set up Rust for universal macOS
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: v0.3/tauri/src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build universal macOS application and disk image
        run: npm run tauri build -- --target universal-apple-darwin --bundles app,dmg

      - name: Prepare release assets
        run: |
          version="${{ inputs.version }}"
          mkdir -p release-assets
          ditto -c -k --sequesterRsrc --keepParent \
            "src-tauri/target/universal-apple-darwin/release/bundle/macos/OPH Control Studio.app" \
            "release-assets/OPH-Control-Studio_${version}_macos-universal.app.zip"
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg \
            "release-assets/OPH-Control-Studio_${version}_macos-universal.dmg"

      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.version }}" --repo "${{ github.repository }}" --clobber release-assets/*

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OPH-Control-Studio-macOS-universal
          path: v0.3/tauri/release-assets/*
